services:
  web:
    build: { context: ., dockerfile: Dockerfile }
    command: npm run dev
    env_file: .env
    environment:
      - DOCKER_ENV=true
    ports: ["3000:3000"]
    volumes: [".:/app", "/app/node_modules"]
    depends_on:
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      worker: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 20
  node-worker:
    build: { context: ., dockerfile: Dockerfile }
    command: npm run worker:node
    env_file: .env
    environment:
      - DOCKER_ENV=true
    volumes: [".:/app", "/app/node_modules"]
    depends_on:
      redis: { condition: service_healthy }
  worker:
    build: { context: ./worker, dockerfile: Dockerfile }
    env_file: .env
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  onlyoffice:
    image: onlyoffice/documentserver:8.1
    ports: ["8080:80"]
    environment:
      - JWT_ENABLED=false
      - ALLOW_PRIVATE_IP_ADDRESS=true
      - ALLOW_META_IP_ADDRESS=true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 10
  minio:
    image: minio/minio:RELEASE.2024-08-26T15-33-07Z
    command: server /data --console-address ":9001"
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20
volumes:
  minio-data:
